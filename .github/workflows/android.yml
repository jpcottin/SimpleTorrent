name: Android CI

on:
  push:
    branches: [ master, main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Job 1: JVM unit tests (fast, no NDK required) ──────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        # Submodules not needed for JVM-only tests (no NDK build triggered)

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Validate Compose Preview Screenshots
        run: ./gradlew :app:validateDebugScreenshotTest --no-daemon

      - name: Upload screenshot test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-test-report
          path: app/build/reports/screenshotTest/preview/debug/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/

  # ── Job 2: Build debug APK (needs NDK + Boost + submodules) ─────────────────
  build:
    name: Build Debug APK
    runs-on: macos-14      # M1 runner — Homebrew lives at /opt/homebrew
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Boost via Homebrew
        run: brew install boost

      - name: Resolve Boost CMake dir
        run: |
          BOOST_DIR=$(find /opt/homebrew/lib/cmake -maxdepth 1 -name "Boost-*" -type d \
                      | sort -V | tail -1)
          echo "BOOST_CMAKE_DIR=$BOOST_DIR" >> "$GITHUB_ENV"
          echo "BOOST_INCLUDE_DIR=/opt/homebrew/include" >> "$GITHUB_ENV"
          echo "Found Boost CMake dir: $BOOST_DIR"

      - name: Cache Android OpenSSL
        uses: actions/cache@v4
        with:
          path: libs/openssl-android
          key: openssl-android-3.5.7-${{ runner.os }}

      - name: Build OpenSSL for Android
        run: scripts/build-openssl-android.sh

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  # ── Job 2b: Build debug APK on Linux (NDK cross-compile sanity on every PR) ──
  # The macOS job above covers the primary dev path; this one guards the Linux
  # toolchain (apt Boost in /usr/include + #include_next) so it can't silently rot.
  build-linux:
    name: Build Debug APK (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Boost via apt
        run: sudo apt-get install -y libboost-dev

      - name: Resolve Boost dirs
        run: |
          BOOST_DIR=$(find /usr/lib -maxdepth 4 -name "Boost-*" -type d 2>/dev/null \
                      | sort -V | tail -1)
          echo "BOOST_CMAKE_DIR=$BOOST_DIR" >> "$GITHUB_ENV"
          # Isolated dir with ONLY a boost/ symlink: -I<dir> finds boost/* but does
          # not expose glibc system headers (features-time64.h → bits/wordsize.h)
          # which are absent in the NDK cross-compilation sysroot.
          mkdir -p /tmp/boost-headers
          ln -sfn /usr/include/boost /tmp/boost-headers/boost
          echo "BOOST_INCLUDE_DIR=/tmp/boost-headers" >> "$GITHUB_ENV"
          echo "Found Boost CMake dir: $BOOST_DIR"

      - name: Cache Android OpenSSL
        uses: actions/cache@v4
        with:
          path: libs/openssl-android
          key: openssl-android-3.5.7-${{ runner.os }}

      - name: Build OpenSSL for Android
        run: scripts/build-openssl-android.sh

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-linux
          path: app/build/outputs/apk/debug/app-debug.apk

  # ── Job 3: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: gradle/actions/setup-gradle@v6

      - name: Run lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  # ── Job 4: Instrumented (UI) tests — runs on demand or on main ──────────────
  # Requires NDK build + emulator; triggered only on pushes to main to save CI minutes.
  instrumented-tests:
    name: Instrumented Tests (API ${{ matrix.api-level }}${{ matrix.suffix && format(' {0}', matrix.suffix) || '' }})
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # 37.x preview legs run non-blocking (matrix.experimental); the rest gate.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: '35'
            target: google_apis
            gpu: swiftshader_indirect
          # API 37.x ps16k legs. channel selects the emulator (and image
          # revision) via sdkmanager --channel.
          - api-level: '37.0'
            suffix: 'stable-lavapipe'
            target: google_apis_ps16k
            ram-size: 4096M
            memory-option: -memory 4096
            gpu: lavapipe
            cores: 4
            experimental: true
          - api-level: '37.0'
            suffix: 'canary-lavapipe'
            target: google_apis_ps16k
            channel: canary
            ram-size: 4096M
            memory-option: -memory 4096
            gpu: lavapipe
            cores: 4
            experimental: true
          - api-level: '37.0'
            suffix: 'canary-auto'
            target: google_apis_ps16k
            channel: canary
            ram-size: 4096M
            memory-option: -memory 4096
            gpu: auto
            cores: 4
            experimental: true
          - api-level: '37.1'
            suffix: 'canary-lavapipe'
            target: google_apis_ps16k
            channel: canary
            ram-size: 4096M
            memory-option: -memory 4096
            gpu: lavapipe
            cores: 4
            experimental: true
          - api-level: '37.1'
            suffix: 'canary-auto'
            target: google_apis_ps16k
            channel: canary
            ram-size: 4096M
            memory-option: -memory 4096
            gpu: auto
            cores: 4
            experimental: true
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The runner image ships an outdated avdmanager that writes target=android-0
      # for minor-versioned packages (android-37.x); the emulator clamps that to
      # API 3 and skips the Vulkan/GLDirectMem auto-enable the ps16k images need.
      - name: Update SDK cmdline-tools
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "cmdline-tools;latest" > /dev/null
          # sdkmanager won't overwrite the preinstalled dir; it installs to latest-2.
          if [ -d "$SDK/cmdline-tools/latest-2" ]; then
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/latest-2" "$SDK/cmdline-tools/latest"
          fi
          "$SDK/cmdline-tools/latest/bin/avdmanager" list device > /dev/null

      - name: Install Boost via apt
        run: sudo apt-get install -y libboost-dev

      - name: Resolve Boost CMake dir
        run: |
          BOOST_DIR=$(find /usr/lib -maxdepth 4 -name "Boost-*" -type d 2>/dev/null \
                      | sort -V | tail -1)
          echo "BOOST_CMAKE_DIR=$BOOST_DIR" >> "$GITHUB_ENV"
          # Isolated dir with ONLY a boost/ symlink: -I<dir> finds boost/* but does
          # not expose glibc system headers (features-time64.h → bits/wordsize.h)
          # which are absent in the NDK cross-compilation sysroot.
          mkdir -p /tmp/boost-headers
          ln -s /usr/include/boost /tmp/boost-headers/boost
          echo "BOOST_INCLUDE_DIR=/tmp/boost-headers" >> "$GITHUB_ENV"
          echo "Found Boost CMake dir: $BOOST_DIR"

      - name: Cache Android OpenSSL
        uses: actions/cache@v4
        with:
          path: libs/openssl-android
          key: openssl-android-3.5.7-${{ runner.os }}

      - name: Build OpenSSL for Android
        run: scripts/build-openssl-android.sh

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target }}
          channel: ${{ matrix.channel || 'stable' }}
          profile: pixel_6
          ram-size: ${{ matrix.ram-size }}
          cores: ${{ matrix.cores }}
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-snapshot -gpu ${{ matrix.gpu }} -noaudio -no-boot-anim -camera-back none ${{ matrix.memory-option || '' }} -delay-adb -verbose -show-kernel -debug-metrics -metrics-collection
          script: |
            echo "===== AVD root ini ====="; cat "$HOME/.android/avd/test.ini" 2>/dev/null || echo "(test.ini not found)"
            ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-results-api${{ matrix.api-level }}${{ matrix.suffix && format('-{0}', matrix.suffix) || '' }}
          path: app/build/reports/androidTests/connected/

  # Experiment: drive the whole emulator flow with the new Android CLI
  # (https://d.android.com/tools/agents/android-cli) instead of
  # sdkmanager/avdmanager and the emulator-runner action.
  android-cli-experiment:
    name: Android CLI experiment (API 37.0 canary emulator)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Boost via apt
        run: sudo apt-get install -y libboost-dev

      - name: Resolve Boost dirs
        run: |
          BOOST_DIR=$(find /usr/lib -maxdepth 4 -name "Boost-*" -type d 2>/dev/null \
                      | sort -V | tail -1)
          echo "BOOST_CMAKE_DIR=$BOOST_DIR" >> "$GITHUB_ENV"
          mkdir -p /tmp/boost-headers
          ln -sfn /usr/include/boost /tmp/boost-headers/boost
          echo "BOOST_INCLUDE_DIR=/tmp/boost-headers" >> "$GITHUB_ENV"

      - name: Cache Android OpenSSL
        uses: actions/cache@v4
        with:
          path: libs/openssl-android
          key: openssl-android-3.5.7-${{ runner.os }}

      - name: Build OpenSSL for Android
        run: scripts/build-openssl-android.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android CLI
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Android CLI diagnostics
        run: |
          android --version
          android info
          android sdk list | head -40

      - name: Install canary emulator and API 37.0 ps16k image with the CLI
        run: |
          android sdk install --canary emulator platform-tools system-images/android-37.0/google_apis_ps16k/x86_64
          android sdk list | grep -iE "^  emulator|android-37" || true

      # 'android emulator create' is profile-based with no way to pin an image (it
      # picks google_apis_playstore, whose first-boot Play overlays steal window
      # focus and break Espresso). An AVD is just ini files, so create the profile
      # with the CLI and retarget it at the pinned image — no sdkmanager/avdmanager.
      - name: Create AVD with the CLI and retarget it to API 37.0 ps16k
        run: |
          android emulator create medium_phone
          DEVICE="$(android emulator list | head -n1)"
          AVD_DIR="$HOME/.android/avd/$DEVICE.avd"
          if [ -z "$DEVICE" ] || [ ! -d "$AVD_DIR" ]; then
            echo "ERROR: created AVD not found (DEVICE='$DEVICE')"
            ls -la "$HOME/.android/avd/" || true
            exit 1
          fi
          echo "CLI created AVD: $DEVICE"
          CFG="$AVD_DIR/config.ini"
          # Replace-or-append so a key missing from the CLI-written config cannot
          # silently keep its profile default.
          set_ini() {
            if grep -q "^$1=" "$CFG"; then sed -i "s#^$1=.*#$1=$2#" "$CFG"; else echo "$1=$2" >> "$CFG"; fi
          }
          sed -i 's/^target=.*/target=android-37.0/' "$HOME/.android/avd/$DEVICE.ini"
          set_ini image.sysdir.1 'system-images/android-37.0/google_apis_ps16k/x86_64/'
          set_ini tag.id google_apis
          set_ini tag.display 'Google APIs'
          set_ini PlayStore.enabled false
          set_ini hw.ramSize 4096
          set_ini hw.cpu.ncore 4
          set_ini disk.dataPartition.size 8192M
          # Optional plural tag keys, if the profile wrote them, must not keep
          # claiming the playstore image.
          if grep -q '^tag.ids=' "$CFG"; then sed -i 's/^tag.ids=.*/tag.ids=google_apis,page_size_16kb/' "$CFG"; fi
          if grep -q '^tag.displaynames=' "$CFG"; then sed -i 's/^tag.displaynames=.*/tag.displaynames=Google APIs,16 KB Page Size/' "$CFG"; fi
          echo "===== root ini ====="; cat "$HOME/.android/avd/$DEVICE.ini"
          echo "===== config.ini ====="; cat "$CFG"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"

      # 'android emulator start' passes neither -noaudio nor -no-window, so the
      # runner needs libpulse and an X display.
      - name: Install emulator host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0 xvfb
          Xvfb :99 -screen 0 1280x800x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Start emulator with the CLI
        timeout-minutes: 15
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export PATH="$SDK/platform-tools:$PATH"
          echo "Starting AVD: $DEVICE"
          # start returns 0 even if the emulator process dies; verify via adb.
          android emulator start --cold "$DEVICE"
          for _ in $(seq 1 30); do adb get-state >/dev/null 2>&1 && break; sleep 2; done
          adb get-state >/dev/null 2>&1 || { echo "===== emulator.log ====="; cat "$HOME/.android/$DEVICE/emulator.log" 2>/dev/null || echo "(no emulator.log)"; exit 1; }
          adb devices
          adb shell getprop ro.build.version.sdk
          adb shell getprop sys.boot_completed
          # The CLI has no disable-animations equivalent (emulator-runner sets it);
          # Espresso needs animations off.
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb logcat -v time > "${{ github.workspace }}/emulator_logcat.txt" &

      - name: Dump emulator.log on failure
        if: failure()
        run: cat "$HOME/.android/$DEVICE/emulator.log" 2>/dev/null || echo "(no emulator.log)"

      - name: Run instrumented tests
        run: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Stop emulator
        if: always()
        run: android emulator stop "$DEVICE" || true

      - name: Dump logcat on failure
        if: failure()
        run: tail -n 500 "${{ github.workspace }}/emulator_logcat.txt" 2>/dev/null || echo "no logcat captured"

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-report-android-cli-experiment
          path: app/build/reports/androidTests/connected/
