name: Android CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Job 1: JVM unit tests (fast, no NDK required) ──────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Submodules not needed for JVM-only tests (no NDK build triggered)

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/

  # ── Job 2: Build debug APK (needs NDK + Boost + submodules) ─────────────────
  build:
    name: Build Debug APK
    runs-on: macos-14      # M1 runner — Homebrew lives at /opt/homebrew
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Boost via Homebrew
        run: brew install boost

      - name: Resolve Boost CMake dir
        run: |
          BOOST_DIR=$(find /opt/homebrew/lib/cmake -maxdepth 1 -name "Boost-*" -type d \
                      | sort -V | tail -1)
          echo "BOOST_CMAKE_DIR=$BOOST_DIR" >> "$GITHUB_ENV"
          echo "Found Boost CMake dir: $BOOST_DIR"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  # ── Job 3: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Run lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  # ── Job 4: Instrumented (UI) tests — runs on demand or on main ──────────────
  # Requires NDK build + emulator; triggered only on pushes to main to save CI minutes.
  instrumented-tests:
    name: Instrumented Tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Boost via apt
        run: sudo apt-get install -y libboost-dev

      - name: Resolve Boost CMake dir
        run: |
          BOOST_DIR=$(find /usr/lib -maxdepth 4 -name "Boost-*" -type d 2>/dev/null \
                      | sort -V | tail -1)
          echo "BOOST_CMAKE_DIR=$BOOST_DIR" >> "$GITHUB_ENV"
          echo "Found Boost CMake dir: $BOOST_DIR"

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: app/build/reports/androidTests/connected/
